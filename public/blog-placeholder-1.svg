<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="60%" style="stop-color:#1a1035"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid dots (subtle) -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative circles (blurred background orbs) -->
  <circle cx="960" cy="130" r="220" fill="#7c3aed" opacity="0.08"/>
  <circle cx="200" cy="520" r="180" fill="#a78bfa" opacity="0.06"/>

  <!-- Left accent bar -->
  <rect x="80" y="200" width="5" height="230" rx="2.5" fill="url(#accentGrad)"/>

  <!-- Badge -->
  <rect x="105" y="200" width="150" height="34" rx="17" fill="#7c3aed" opacity="0.25"/>
  <rect x="105" y="200" width="150" height="34" rx="17" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
  <text x="180" y="222" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="0.08em" text-transform="uppercase">SMARTOPS SEO</text>

  <!-- Main title -->
  <text x="105" y="310" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">Conteúdo SEO</text>
  <text x="105" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.03em" filter="url(#glow)">Automático com IA</text>

  <!-- Subtitle -->
  <text x="105" y="440" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#9ca3af" letter-spacing="0.01em">Gerado por n8n + OpenAI + Astro + Netlify</text>

  <!-- Bottom divider -->
  <rect x="105" y="490" width="280" height="2" rx="1" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Bottom tags -->
  <rect x="105" y="510" width="70" height="26" rx="13" fill="#1e1b4b"/>
  <text x="140" y="528" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">#SEO</text>

  <rect x="185" y="510" width="52" height="26" rx="13" fill="#1e1b4b"/>
  <text x="211" y="528" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">#IA</text>

  <rect x="247" y="510" width="90" height="26" rx="13" fill="#1e1b4b"/>
  <text x="292" y="528" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">#Astro 6</text>

  <!-- Right decorative element: node graph -->
  <g opacity="0.18">
    <circle cx="900" cy="315" r="60" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="900" cy="315" r="10" fill="#7c3aed"/>
    <circle cx="1020" cy="220" r="7" fill="#7c3aed"/>
    <circle cx="1080" cy="380" r="7" fill="#7c3aed"/>
    <circle cx="790" cy="240" r="7" fill="#7c3aed"/>
    <circle cx="820" cy="430" r="7" fill="#7c3aed"/>
    <circle cx="1000" cy="460" r="5" fill="#a78bfa"/>
    <line x1="900" y1="315" x2="1020" y2="220" stroke="#a78bfa" stroke-width="1"/>
    <line x1="900" y1="315" x2="1080" y2="380" stroke="#a78bfa" stroke-width="1"/>
    <line x1="900" y1="315" x2="790" y2="240" stroke="#a78bfa" stroke-width="1"/>
    <line x1="900" y1="315" x2="820" y2="430" stroke="#a78bfa" stroke-width="1"/>
    <line x1="900" y1="315" x2="1000" y2="460" stroke="#a78bfa" stroke-width="1"/>
    <line x1="1020" y1="220" x2="1080" y2="380" stroke="#7c3aed" stroke-width="0.8"/>
    <line x1="820" y1="430" x2="1000" y2="460" stroke="#7c3aed" stroke-width="0.8"/>
  </g>
</svg>
