<svg width="580" height="490" viewBox="0 0 580 490" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gG" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.5)"/></filter>
  </defs>

  <ellipse cx="290" cy="240" rx="280" ry="220" fill="url(#gG)"/>
  <ellipse cx="450" cy="120" rx="200" ry="160" fill="url(#gB)"/>

  <pattern id="dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="580" height="490" fill="url(#dots)"/>

  <!-- Top flow: WhatsApp → AI → CRM -->

  <!-- Node 1: WhatsApp -->
  <rect x="30" y="60" width="130" height="110" rx="14" fill="rgba(10,22,15,0.95)" stroke="rgba(37,211,102,0.5)" stroke-width="1.5" filter="url(#sh)"/>
  <!-- WA icon circle -->
  <circle cx="95" cy="98" r="22" fill="rgba(37,211,102,0.15)" stroke="#25d366" stroke-width="1.5"/>
  <text x="95" y="106" text-anchor="middle" font-size="22" font-family="system-ui">💬</text>
  <text x="95" y="147" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="700" font-family="system-ui,sans-serif">WhatsApp</text>
  <text x="95" y="161" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9" font-family="system-ui,sans-serif">mensagem recebida</text>

  <!-- Arrow 1 →2 -->
  <line x1="162" y1="115" x2="208" y2="115" stroke="rgba(16,185,129,0.5)" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="185" cy="115" r="3" fill="#10b981" fill-opacity="0.7"/>
  <polygon points="208,110 218,115 208,120" fill="rgba(16,185,129,0.7)"/>

  <!-- Node 2: AI -->
  <rect x="220" y="60" width="130" height="110" rx="14" fill="rgba(10,10,22,0.95)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="285" cy="98" r="22" fill="rgba(124,58,237,0.15)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="285" y="106" text-anchor="middle" font-size="22" font-family="system-ui">🤖</text>
  <text x="285" y="147" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="700" font-family="system-ui,sans-serif">IA · GPT-4</text>
  <text x="285" y="161" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9" font-family="system-ui,sans-serif">resposta inteligente</text>

  <!-- Arrow 2 →3 -->
  <line x1="352" y1="115" x2="398" y2="115" stroke="rgba(59,130,246,0.5)" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="375" cy="115" r="3" fill="#3b82f6" fill-opacity="0.7"/>
  <polygon points="398,110 408,115 398,120" fill="rgba(59,130,246,0.7)"/>

  <!-- Node 3: n8n -->
  <rect x="410" y="60" width="130" height="110" rx="14" fill="rgba(10,10,22,0.95)" stroke="rgba(59,130,246,0.5)" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="475" cy="98" r="22" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="475" y="106" text-anchor="middle" font-size="22" font-family="system-ui">⚙️</text>
  <text x="475" y="147" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11" font-weight="700" font-family="system-ui,sans-serif">n8n</text>
  <text x="475" y="161" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9" font-family="system-ui,sans-serif">fluxo automático</text>

  <!-- Down arrows from n8n to sub-nodes -->
  <line x1="445" y1="172" x2="335" y2="218" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="475" y1="172" x2="475" y2="218" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="505" y1="172" x2="530" y2="218" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Sub-node 1: CRM -->
  <rect x="275" y="220" width="118" height="84" rx="12" fill="rgba(10,14,10,0.95)" stroke="rgba(16,185,129,0.35)" stroke-width="1" filter="url(#sh)"/>
  <text x="334" y="256" text-anchor="middle" font-size="18" font-family="system-ui">📋</text>
  <text x="334" y="278" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="10.5" font-weight="700" font-family="system-ui,sans-serif">CRM / Leads</text>
  <text x="334" y="293" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8.5" font-family="system-ui,sans-serif">registro automático</text>

  <!-- Sub-node 2: Notificações -->
  <rect x="413" y="220" width="118" height="84" rx="12" fill="rgba(10,14,10,0.95)" stroke="rgba(234,179,8,0.35)" stroke-width="1" filter="url(#sh)"/>
  <text x="472" y="256" text-anchor="middle" font-size="18" font-family="system-ui">🔔</text>
  <text x="472" y="278" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="10.5" font-weight="700" font-family="system-ui,sans-serif">Notificações</text>
  <text x="472" y="293" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8.5" font-family="system-ui,sans-serif">follow-up 24h</text>

  <!-- Sub-node 3: Relatórios -->
  <rect x="140" y="220" width="118" height="84" rx="12" fill="rgba(10,14,10,0.95)" stroke="rgba(167,139,250,0.35)" stroke-width="1" filter="url(#sh)"/>
  <text x="199" y="256" text-anchor="middle" font-size="18" font-family="system-ui">📊</text>
  <text x="199" y="278" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="10.5" font-weight="700" font-family="system-ui,sans-serif">Relatórios</text>
  <text x="199" y="293" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8.5" font-family="system-ui,sans-serif">dados em tempo real</text>

  <!-- Arrow from WA down to relatórios -->
  <line x1="95" y1="172" x2="160" y2="218" stroke="rgba(37,211,102,0.2)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Bottom stat cards -->
  <rect x="30" y="340" width="160" height="62" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="50" y="364" fill="rgba(255,255,255,0.45)" font-size="10" font-family="system-ui,sans-serif">Disponibilidade</text>
  <text x="50" y="389" fill="#10b981" font-size="20" font-weight="800" font-family="system-ui,sans-serif">24h / 7d</text>

  <rect x="210" y="340" width="160" height="62" rx="10" fill="rgba(124,58,237,0.08)" stroke="rgba(167,139,250,0.25)" stroke-width="1"/>
  <text x="230" y="364" fill="rgba(255,255,255,0.45)" font-size="10" font-family="system-ui,sans-serif">Economia de pessoal</text>
  <text x="230" y="389" fill="#a78bfa" font-size="20" font-weight="800" font-family="system-ui,sans-serif">−60%</text>

  <rect x="390" y="340" width="160" height="62" rx="10" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="410" y="364" fill="rgba(255,255,255,0.45)" font-size="10" font-family="system-ui,sans-serif">Implementação</text>
  <text x="410" y="389" fill="#60a5fa" font-size="20" font-weight="800" font-family="system-ui,sans-serif">em dias</text>

  <!-- Pulse dot on WA -->
  <circle cx="95" cy="62" r="7" fill="#25d366" fill-opacity="0.3"/>
  <circle cx="95" cy="62" r="4" fill="#25d366"/>

  <!-- Label at top -->
  <text x="290" y="445" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-size="10" font-family="system-ui,sans-serif" letter-spacing="3">AUTOMAÇÃO COM IA · SMARTOPS</text>
</svg>
