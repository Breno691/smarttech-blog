  <text x="86" y="332" fill="rgba(255,255,255,0.08)" font-size="80" font-weight="900" font-family="system-ui,sans-serif" letter-spacing="-2">BLOG</text>

  <rect x="0" y="400" width="800" height="20" fill="rgba(167,139,250,0.15)"/>
