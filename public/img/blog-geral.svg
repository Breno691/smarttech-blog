  <rect x="238" y="158" width="150" height="30" rx="15" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="313" y="178" text-anchor="middle" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui">Automação com IA</text>

  <rect x="400" y="158" width="150" height="30" rx="15" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="475" y="178" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600" font-family="system-ui">Melhoria Contínua</text>

  <rect x="562" y="158" width="140" height="30" rx="15" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
  <text x="632" y="178" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600" font-family="system-ui">Manutenção &amp; TI</text>

  <!-- Decorative: big text -->
  <text x="560" y="290" fill="rgba(167,139,250,0.04)" font-size="220" font-weight="900" font-family="system-ui,sans-serif">B</text>

  <!-- Bottom section text -->
