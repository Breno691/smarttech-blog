<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <radialGradient id="gl1" cx="25%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <ellipse cx="200" cy="150" rx="280" ry="220" fill="url(#gl1)"/>
  <ellipse cx="640" cy="300" rx="240" ry="180" fill="url(#gl2)"/>
  <pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8"/>
  </pattern>
  <rect width="800" height="420" fill="url(#g)"/>

  <!-- Logo-style text -->
  <text x="86" y="80" fill="rgba(255,255,255,0.95)" font-size="44" font-weight="900" font-family="system-ui,sans-serif" letter-spacing="-1">Smart<tspan fill="#a78bfa">Ops</tspan> <tspan fill="#10b981">IA</tspan></text>
  <text x="86" y="116" fill="rgba(255,255,255,0.4)" font-size="15" font-family="system-ui,sans-serif" letter-spacing="2">BLOG · LEAN · AUTOMAÇÃO · BH</text>

  <!-- Tag pills -->
  <rect x="86" y="158" width="140" height="30" rx="15" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
